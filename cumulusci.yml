minimum_cumulusci_version: '3.43.0'
project:
    name: FormBuilder
    package:
        name: 'Flow Tool Kit: Form and Table Builder'
        namespace: FlowToolKit
        api_version: '66.0'
    git:
    source_format: sfdx


sources:
    snowfakery:
            github: 'https://github.com/SFDO-Tooling/Snowfakery'

plans:
    install:
        slug: install
        title: Install Flow Tool Kit
        tier: primary
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup → Session Settings → enable 'Use Lightning Web Security for Lightning web components'. Without LWS, forms with large datasets will experience severe performance degradation."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup → Enhanced Email to enable it. Flow Tool Kit requires Enhanced Email as a package dependency."
        steps:
            1:
                flow: install_prod
            2:
                task: deploy
                options:
                    path: force-app-post
                ui_options:
                    name: "Deploy Post-Install Components"
                    is_required: True
            3:
                task: deploy
                options:
                    path: unpackaged/post/config
                ui_options:
                    name: "Deploy Default Configuration (Custom Metadata)"
                    is_required: False
                    is_recommended: True

    upgrade:
        slug: upgrade
        title: Upgrade Flow Tool Kit
        tier: additional
        is_listed: False
        preflight_message: "This upgrades Flow Tool Kit and its dependencies to the latest version. Existing custom metadata records will not be modified."
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup → Session Settings → enable 'Use Lightning Web Security for Lightning web components'. Without LWS, forms with large datasets will experience severe performance degradation."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup → Enhanced Email to enable it. Flow Tool Kit requires Enhanced Email as a package dependency."
        steps:
            1:
                task: update_dependencies
            2:
                task: install_managed

flows:

    config_dev:
        steps:
            89:
                task: deploy
                description: Deploy grant application demo form components (#263)
                options:
                    path: unpackaged/config/forms/grant-application
            90:
                task: snowfakery
                description: Load standard test data (Form Template + Campaigns)
                options:
                    recipe: datasets/default/sample_data.recipe.yml
            91:
                task: execute_anon
                description: Bind grant demo components and remove auto-default page/sections (#263)
                options:
                    path: scripts/grant_demo_cleanup.apex

    # #405 perf baselines: mirrors what a subscriber gets from the MetaDeploy install plan,
    # plus the Testing Aura EC site as the standalone-formTemplate control surface,
    # plus the fixed perf test assets (forms + PERF flows).
    # install_prod is inlined (like npc_dev_org) because its config_managed includes
    # load_sample_data, which fails in this repo (no datasets/default/default.dataset.sql)
    # and CCI can't disable nested tasks via flow step options.
    perf_baseline_org:
        steps:
            0.1:
                flow: dependencies
            0.2:
                task: install_managed
            0.3:
                task: deploy_post
            0.4:
                task: update_admin_profile
            2:
                task: deploy
                options:
                    path: force-app-post
            3:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            4:
                task: deploy
                options:
                    path: unpackaged/config/perf
            5:
                task: create_community
                options:
                    template: Build Your Own
                    name: Testing Aura
                    url_path_prefix: testing
                ignore_failure: True
            6:
                task: publish_community
                options:
                    name: Testing Aura
                ignore_failure: True
            7:
                task: execute_anon
                description: Configure Testing Aura guest user permissions
                options:
                    path: datasets/dev/setup_testing_aura_site.apex
                ignore_failure: True

    dev_org:
        steps:
            5:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            6:
                task: deploy
                options:
                    path: force-app-post
            # Testing Aura EC site for iframe embed testing
            7:
                task: create_community
                options:
                    template: Build Your Own
                    name: Testing Aura
                    url_path_prefix: testing
                ignore_failure: True
            8:
                task: publish_community
                options:
                    name: Testing Aura
                ignore_failure: True
            9:
                task: execute_anon
                description: Configure Testing Aura guest user permissions
                options:
                    path: datasets/dev/setup_testing_aura_site.apex
                ignore_failure: True
            10:
                task: execute_anon
                description: Resolve conversion-test related-record section markers to real section Ids (Snowfakery cannot write an Id into the Text field Internal_SectionId__c)
                options:
                    path: scripts/seed-conversion-related-records.apex
                ignore_failure: True
            11:
                task: deploy
                description: Design block showcase page on the Testing Aura site. No-ops until scratch-org/showcase/experiences has been captured once, see its README.
                options:
                    path: scratch-org/showcase
                ignore_failure: True
            12:
                task: publish_community
                description: Republish so the showcase page is visible to the guest user
                options:
                    name: Testing Aura
                ignore_failure: True

    npc_dev_org:
        description: Set up an NPC scratch org with Grantmaking, OmniStudio, Action Plans, and Experience Cloud. Replicates dev_org (dependencies, deploy force-app, sample data, permission sets) but skips update_admin_profile (fails on PersonAccounts) and the Testing Aura EC site (NPC org uses the Grantmaking Portal instead).
        group: Flow Tool Kit
        steps:
            # Replicate dev_org's structure - cannot use dev_org as subflow because CCI can't disable nested tasks via flow step options
            1:
                flow: dependencies
            2:
                flow: deploy_unmanaged
            # Inline the parts of config_dev we want - SKIP update_admin_profile (fails with "record type Account.Business_Account not found" on PersonAccount orgs)
            3:
                task: deploy_post
                options:
                    path: unpackaged/post
            # Assign project permission sets - update_admin_profile (skipped above) would normally grant FLS on namespaced fields to the admin profile. Form_Builder_Admin provides FLS via permission set instead.
            4:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            5:
                task: deploy
                options:
                    path: force-app-post
            # Skip default snowfakery (datasets/default/sample_data.recipe.yml) - NPC orgs have strict State/Country Picklists which break fake: state_abbr. NPC has its own sample data pipeline (steps 11.1–11.3).
            6:
                task: snapshot_changes
            # NPC Permission Set Licenses
            7:
                task: assign_permission_set_licenses
                options:
                    api_names: OmniStudioDesigner,ActionPlansPsl,GrantmakingPsl,FundraisingAccessPsl,ProgramManagementPsl,DynamicAssessmentPsl,GroupMembershipPsl,DocumentChecklistPsl,CarePlansPermissionSetLicense,IndustriesAssessmentPsl
                ignore_failure: True
            # NPC Permission Sets
            8:
                task: assign_permission_sets
                options:
                    api_names: OmniStudioAdmin,OmniStudioExecution,ActionPlans,GrantmakingManager,FundraisingAccess,AdvancedProgramManagement,DynamicAssessmentPsl,GroupMembershipPsl,AnalyticsStoreUser,DocumentChecklist,CarePlansPermissionSetLicense,IndustriesAssessmentPermissionSet,IndustriesInteractionSummaryPsl,Fundraising_Admin
                ignore_failure: True
            # NPC Admin Setup
            9:
                task: execute_anon
                options:
                    path: datasets/npc/setup_admin_user.apex
                ignore_failure: True
            # Deploy NPC metadata
            10:
                task: deploy
                options:
                    path: force-app-npc
                ui_options:
                    name: "Deploy NPC Configuration (fields, profiles, LWC, Apex, Flows, FlexiPages, List Views, Settings, Sharing)"
            # NPC Stage Definitions
            11:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_stage_definitions.apex
                ignore_failure: True
            # NPC Sample Data (Snowfakery)
            11.1:
                task: generate_and_load_from_yaml
                options:
                    generator_yaml: datasets/npc/npc_sample_data.recipe.yml
                ignore_failure: True
            # NPC Sample Accounts
            11.2:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_accounts.apex
                ignore_failure: True
            # NPC Sample Data (Apex)
            11.3:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_data.apex
                ignore_failure: True
            # Create Grantmaking Community
            12:
                task: create_community
                options:
                    template: Grantmaking
                    name: Grantmaking Portal
                    url_path_prefix: grantmaking
                ignore_failure: True
            13:
                task: publish_community
                options:
                    name: Grantmaking Portal
                ignore_failure: True
            # Deploy EC Navigation (post-community)
            13.1:
                task: deploy
                options:
                    path: unpackaged/npc-post-community
                ui_options:
                    name: "Deploy EC Navigation Menu (post-community)"
                ignore_failure: True
            13.2:
                task: publish_community
                options:
                    name: Grantmaking Portal
                ignore_failure: True
            # Network Members + Portal Users
            14:
                task: execute_anon
                options:
                    path: datasets/npc/add_network_members.apex
                ignore_failure: True
            15:
                task: execute_anon
                options:
                    path: datasets/npc/create_portal_users.apex
                ignore_failure: True
            16:
                task: snapshot_changes

    release_2gp_beta:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest_beta"


    release_2gp_production:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest"

    # Subscriber-style NPC org (org: npc_subscriber). Installs the latest released Flow Tool Kit via install_managed,
    # then the NPC licenses/permission sets, force-app-npc configuration and sample data - mirrors npc_dev_org steps 7-11.3
    # verbatim. update_admin_profile is skipped (fails on PersonAccounts); the Grantmaking Portal community is NOT created.
    npc_subscriber_org:
        description: Subscriber-style NPC org - latest released Flow Tool Kit INSTALLED (non-namespaced), NPC licenses and permission sets, force-app-npc configuration, stage definitions and sample data. No community.
        steps:
            1:
                flow: dependencies
            2:
                task: install_managed
            3:
                task: deploy_post
                options:
                    path: unpackaged/post
            4:
                task: deploy
                options:
                    path: force-app-post
            5:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            6:
                task: assign_permission_set_licenses
                options:
                    api_names: OmniStudioDesigner,ActionPlansPsl,GrantmakingPsl,FundraisingAccessPsl,ProgramManagementPsl,DynamicAssessmentPsl,GroupMembershipPsl,DocumentChecklistPsl,CarePlansPermissionSetLicense,IndustriesAssessmentPsl
                ignore_failure: True
            # NPC Permission Sets
            7:
                task: assign_permission_sets
                options:
                    api_names: OmniStudioAdmin,OmniStudioExecution,ActionPlans,GrantmakingManager,FundraisingAccess,AdvancedProgramManagement,DynamicAssessmentPsl,GroupMembershipPsl,AnalyticsStoreUser,DocumentChecklist,CarePlansPermissionSetLicense,IndustriesAssessmentPermissionSet,IndustriesInteractionSummaryPsl,Fundraising_Admin
                ignore_failure: True
            # NPC Admin Setup
            8:
                task: execute_anon
                options:
                    path: datasets/npc/setup_admin_user.apex
                ignore_failure: True
            # Deploy NPC metadata
            9:
                task: deploy
                options:
                    path: force-app-npc
                ui_options:
                    name: "Deploy NPC Configuration (fields, profiles, LWC, Apex, Flows, FlexiPages, List Views, Settings, Sharing)"
            # NPC Stage Definitions
            10:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_stage_definitions.apex
                ignore_failure: True
            # NPC Sample Data (Snowfakery)
            10.1:
                task: generate_and_load_from_yaml
                options:
                    generator_yaml: datasets/npc/npc_sample_data.recipe.yml
                ignore_failure: True
            # NPC Sample Accounts
            10.2:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_accounts.apex
                ignore_failure: True
            # NPC Sample Data (Apex)
            10.3:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_data.apex
                ignore_failure: True
            # Create Grantmaking Community

tasks:

    export_form:
        class_path: cci_flowtoolkit_tasks.export_form.ExportFormMetadata

    check_lws_enabled:
        class_path: tasks.check_lws_enabled.CheckLWSEnabled
        description: Check if Lightning Web Security (LWS) is enabled

    check_enhanced_email:
        class_path: tasks.check_enhanced_email.CheckEnhancedEmailEnabled
        description: Check if Enhanced Email is enabled

    create_package_version:
        options:
            post_install_script: InstallScript

    github_copy_subtree:
        options:
            repo_url: "https://github.com/common-unite/Flow_Tool_Kit_Public"
            branch: "main"
            create_release: true
            release_body: true
            include: [ "cumulusci.yml","sfdx-project.json","orgs/","README.md","documents/" ]

    robot:
        options:
            suites: robot/FormBuilder/tests
            options:
                outputdir: robot/FormBuilder/results

    robot_testdoc:
        options:
            path: robot/FormBuilder/tests
            output: robot/FormBuilder/doc/FormBuilder_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 90


orgs:
    scratch:
        build:
            config_file: orgs/build.json

        packaging:
            config_file: orgs/packaging.json

        dev:
            config_file: orgs/dev.json
            days: 30
            namespaced: True

        # Subscriber-sim org for #405 screen-flow perf baselines: released package INSTALLED, not source.
        # Deliberately non-namespaced - extension packages (Stripe, UnofficialSF) require the installed base.
        perf_baseline:
            config_file: orgs/dev.json
            days: 30
            namespaced: False


        # #513 Form Design Kit: renders the showcase form so Phase 2 can capture
        # real markup and screenshots from the running renderer.
        feature_form-design-kit:
            config_file: orgs/dev.json
            days: 30
            namespaced: True





        # Subscriber-style NPC org: latest RELEASED Flow Tool Kit installed (never source), non-namespaced,
        # so force-app-npc is built and deployed exactly as a client would. Community is deliberately not created here.
        npc_subscriber:
            config_file: orgs/npc.json
            days: 30
            namespaced: False

        npc:
            config_file: orgs/npc.json
            days: 30
            namespaced: True

