minimum_cumulusci_version: '3.43.0'
project:
    name: FormBuilder
    package:
        name: 'Flow Tool Kit: Form and Table Builder'
        namespace: FlowToolKit
        api_version: '66.0'
    git:
    source_format: sfdx


sources:
    snowfakery:
            github: 'https://github.com/SFDO-Tooling/Snowfakery'

plans:
    # install_prod is INLINED in both plans, not referenced as a flow. Its nested config_managed
    # runs load_sample_data, which fails here because datasets/default/default.dataset.sql does
    # not exist, and CCI cannot disable a nested task from a flow step. Referencing install_prod
    # would ship a step that fails for every subscriber. Same reason perf_baseline_org inlines it.
    # deploy_post is dropped with it: unpackaged/post/config holds only a wildcard package.xml
    # with no metadata, so it deploys nothing.
    install:
        slug: install
        title: Install Flow Tool Kit
        tier: primary
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup → Session Settings → enable 'Use Lightning Web Security for Lightning web components'. Without LWS, forms with large datasets will experience severe performance degradation."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup → Enhanced Email to enable it. Flow Tool Kit requires Enhanced Email as a package dependency."
        steps:
            1:
                flow: dependencies
            2:
                task: install_managed
            3:
                task: update_admin_profile
            4:
                task: deploy
                options:
                    path: force-app-post
                ui_options:
                    name: "Deploy Post-Install Components"
                    is_required: True

    # AFNP / Nonprofit Cloud orgs. Everything the vanilla plan does, plus the NPC conversion
    # extension and the post-install content the packages cannot carry.
    #
    # Steps 6-11 are gated to a FIRST install. add_npc_conversion_rule_dependencies rewrites the
    # Conversion Rules dependency matrix, which a subscriber is free to edit, so re-running it
    # would discard their work. The gate is repeated on every one of the six steps on purpose:
    # a `checks:` block on a `flow:` step is SILENTLY DROPPED (cumulusci/core/flowrunner.py:645
    # merges checks only inside the `if "task" in step_config` branch), so `flow:
    # npc_conversion_post_install` with one check would have gated nothing.
    #
    # The gate queries InstalledSubscriberPackage by package NAME. The extension shares the
    # FlowToolKit namespace with the base package, so the usual
    # `'<namespace>' in tasks.get_installed_packages()` idiom is already true after the base
    # installs and would skip the setup on a genuine first install.
    npc:
        slug: npc
        title: Install Flow Tool Kit for Nonprofit Cloud
        tier: secondary
        preflight_message: "This installs Flow Tool Kit together with the Nonprofit Cloud conversion extension, which converts form submissions into Person Accounts, households and relationships. Install it in a Nonprofit Cloud org only. Before running it, activate the Standard Person Account Matching Rule and then its duplicate rule in Setup: they ship inactive and no API can activate them."
        post_install_message: "Flow Tool Kit and the Nonprofit Cloud conversion extension are installed. The Conversion Rules picklist values, Account and Contact record types, matching-rule value and Conversion Mapping Defaults have been applied. That setup content runs only on a first installation, so any changes you make to the Conversion Rules dependency matrix are preserved on later upgrades."
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup → Session Settings → enable 'Use Lightning Web Security for Lightning web components'. Without LWS, forms with large datasets will experience severe performance degradation."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup → Enhanced Email to enable it. Flow Tool Kit requires Enhanced Email as a package dependency."
            - when: "'PartyRelationshipGroup' not in tasks.check_sobjects_available()"
              action: error
              message: "This org does not have Nonprofit Cloud. PartyRelationshipGroup was not found in the schema. Install Flow Tool Kit with the standard plan instead."
            - when: "'ContactContactRelation' not in tasks.check_sobjects_available()"
              action: error
              message: "This org does not have Nonprofit Cloud relationships enabled. ContactContactRelation was not found in the schema. Install Flow Tool Kit with the standard plan instead."
        steps:
            1:
                flow: dependencies
            2:
                task: install_managed
            3:
                task: update_admin_profile
            4:
                task: deploy
                options:
                    path: force-app-post
                ui_options:
                    name: "Deploy Post-Install Components"
                    is_required: True
            5:
                task: install_npc_conversion
                ui_options:
                    name: "Install Nonprofit Cloud Conversion Extension"
                    is_required: True
            6:
                task: add_npc_conversion_rules
                ui_options:
                    name: "Add Conversion Rules Picklist Values"
                checks: &npc_first_install_only
                    - when: "tasks.check_npc_conversion_installed()['is_installed']"
                      action: skip
                      message: "The Nonprofit Cloud conversion extension is already installed, so its one-time setup content is skipped. This preserves any changes you have made to the Conversion Rules dependency matrix."
            7:
                task: add_npc_conversion_rule_dependencies
                ui_options:
                    name: "Map Conversion Rules to their Conversion Types"
                checks: *npc_first_install_only
            8:
                task: add_npc_account_record_types
                ui_options:
                    name: "Add Household and Organization Account Record Types"
                checks: *npc_first_install_only
            9:
                task: add_npc_contact_record_type
                ui_options:
                    name: "Set Person Account as the Default Contact Record Type"
                checks: *npc_first_install_only
            10:
                task: add_npc_contact_matching_rule
                ui_options:
                    name: "Add the Person Account Matching Rule Value"
                checks: *npc_first_install_only
            11:
                task: deploy_npc_conversion_post
                ui_options:
                    name: "Apply Conversion Mapping Defaults"
                checks: *npc_first_install_only

    upgrade:
        slug: upgrade
        title: Upgrade Flow Tool Kit
        tier: additional
        is_listed: False
        preflight_message: "This upgrades Flow Tool Kit and its dependencies to the latest version. Existing custom metadata records will not be modified."
        checks:
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup → Session Settings → enable 'Use Lightning Web Security for Lightning web components'. Without LWS, forms with large datasets will experience severe performance degradation."
            - when: "not tasks.check_enhanced_email()['is_enabled']"
              action: error
              message: "Enhanced Email must be enabled. Go to Setup → Enhanced Email to enable it. Flow Tool Kit requires Enhanced Email as a package dependency."
        steps:
            1:
                task: update_dependencies
            2:
                task: install_managed

flows:

    config_dev:
        steps:
            89:
                task: deploy
                description: Deploy grant application demo form components (#263)
                options:
                    path: unpackaged/config/forms/grant-application
            90:
                task: snowfakery
                description: Load standard test data (Form Template + Campaigns)
                options:
                    recipe: datasets/default/sample_data.recipe.yml
            91:
                task: execute_anon
                description: Bind grant demo components and remove auto-default page/sections (#263)
                options:
                    path: scripts/grant_demo_cleanup.apex

    # #405 perf baselines: mirrors what a subscriber gets from the MetaDeploy install plan,
    # plus the Testing Aura EC site as the standalone-formTemplate control surface,
    # plus the fixed perf test assets (forms + PERF flows).
    # install_prod is inlined (like npc_dev_org) because its config_managed includes
    # load_sample_data, which fails in this repo (no datasets/default/default.dataset.sql)
    # and CCI can't disable nested tasks via flow step options.
    perf_baseline_org:
        steps:
            0.1:
                flow: dependencies
            0.2:
                task: install_managed
            0.3:
                task: deploy_post
            0.4:
                task: update_admin_profile
            2:
                task: deploy
                options:
                    path: force-app-post
            3:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            4:
                task: deploy
                options:
                    path: unpackaged/config/perf
            5:
                task: create_community
                options:
                    template: Build Your Own
                    name: Testing Aura
                    url_path_prefix: testing
                ignore_failure: True
            6:
                task: publish_community
                options:
                    name: Testing Aura
                ignore_failure: True
            7:
                task: execute_anon
                description: Configure Testing Aura guest user permissions
                options:
                    path: datasets/dev/setup_testing_aura_site.apex
                ignore_failure: True

    dev_org:
        steps:
            5:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            6:
                task: deploy
                options:
                    path: force-app-post
            # Testing Aura EC site for iframe embed testing
            7:
                task: create_community
                options:
                    template: Build Your Own
                    name: Testing Aura
                    url_path_prefix: testing
                ignore_failure: True
            8:
                task: publish_community
                options:
                    name: Testing Aura
                ignore_failure: True
            9:
                task: execute_anon
                description: Configure Testing Aura guest user permissions
                options:
                    path: datasets/dev/setup_testing_aura_site.apex
                ignore_failure: True
            10:
                task: execute_anon
                description: Resolve conversion-test related-record section markers to real section Ids (Snowfakery cannot write an Id into the Text field Internal_SectionId__c)
                options:
                    path: scripts/seed-conversion-related-records.apex
                ignore_failure: True
            11:
                task: deploy
                description: Design block showcase page on the Testing Aura site. No-ops until scratch-org/showcase/experiences has been captured once, see its README.
                options:
                    path: scratch-org/showcase
                ignore_failure: True
            12:
                task: publish_community
                description: Republish so the showcase page is visible to the guest user
                options:
                    name: Testing Aura
                ignore_failure: True

    npc_dev_org:
        description: Set up an NPC scratch org with Grantmaking, OmniStudio, Action Plans, and Experience Cloud. Replicates dev_org (dependencies, deploy force-app, sample data, permission sets) but skips update_admin_profile (fails on PersonAccounts) and the Testing Aura EC site (NPC org uses the Grantmaking Portal instead).
        group: Flow Tool Kit
        steps:
            # Replicate dev_org's structure - cannot use dev_org as subflow because CCI can't disable nested tasks via flow step options
            1:
                flow: dependencies
            2:
                flow: deploy_unmanaged
            # Inline the parts of config_dev we want - SKIP update_admin_profile (fails with "record type Account.Business_Account not found" on PersonAccount orgs)
            3:
                task: deploy_post
                options:
                    path: unpackaged/post
            # Assign project permission sets - update_admin_profile (skipped above) would normally grant FLS on namespaced fields to the admin profile. Form_Builder_Admin provides FLS via permission set instead.
            4:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            5:
                task: deploy
                options:
                    path: force-app-post
            # Skip default snowfakery (datasets/default/sample_data.recipe.yml) - NPC orgs have strict State/Country Picklists which break fake: state_abbr. NPC has its own sample data pipeline (steps 11.1–11.3).
            6:
                task: snapshot_changes
            # NPC Permission Set Licenses
            7:
                task: assign_permission_set_licenses
                options:
                    api_names: OmniStudioDesigner,ActionPlansPsl,GrantmakingPsl,FundraisingAccessPsl,ProgramManagementPsl,DynamicAssessmentPsl,GroupMembershipPsl,DocumentChecklistPsl,CarePlansPermissionSetLicense,IndustriesAssessmentPsl
                ignore_failure: True
            # NPC Permission Sets
            8:
                task: assign_permission_sets
                options:
                    api_names: OmniStudioAdmin,OmniStudioExecution,ActionPlans,GrantmakingManager,FundraisingAccess,AdvancedProgramManagement,DynamicAssessmentPsl,GroupMembershipPsl,AnalyticsStoreUser,DocumentChecklist,CarePlansPermissionSetLicense,IndustriesAssessmentPermissionSet,IndustriesInteractionSummaryPsl,Fundraising_Admin
                ignore_failure: True
            # NPC Admin Setup
            9:
                task: execute_anon
                options:
                    path: datasets/npc/setup_admin_user.apex
                ignore_failure: True
            # Deploy NPC metadata
            10:
                task: deploy
                options:
                    path: force-app-npc
                ui_options:
                    name: "Deploy NPC Configuration (fields, profiles, LWC, Apex, Flows, FlexiPages, List Views, Settings, Sharing)"
            # NPC Stage Definitions
            11:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_stage_definitions.apex
                ignore_failure: True
            # NPC Sample Data (Snowfakery)
            11.1:
                task: generate_and_load_from_yaml
                options:
                    generator_yaml: datasets/npc/npc_sample_data.recipe.yml
                ignore_failure: True
            # NPC Sample Accounts
            11.2:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_accounts.apex
                ignore_failure: True
            # NPC Sample Data (Apex)
            11.3:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_data.apex
                ignore_failure: True
            # Create Grantmaking Community
            12:
                task: create_community
                options:
                    template: Grantmaking
                    name: Grantmaking Portal
                    url_path_prefix: grantmaking
                ignore_failure: True
            13:
                task: publish_community
                options:
                    name: Grantmaking Portal
                ignore_failure: True
            # Deploy EC Navigation (post-community)
            13.1:
                task: deploy
                options:
                    path: unpackaged/npc-post-community
                ui_options:
                    name: "Deploy EC Navigation Menu (post-community)"
                ignore_failure: True
            13.2:
                task: publish_community
                options:
                    name: Grantmaking Portal
                ignore_failure: True
            # Network Members + Portal Users
            14:
                task: execute_anon
                options:
                    path: datasets/npc/add_network_members.apex
                ignore_failure: True
            15:
                task: execute_anon
                options:
                    path: datasets/npc/create_portal_users.apex
                ignore_failure: True
            16:
                task: snapshot_changes

    release_2gp_beta:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest_beta"


    release_2gp_production:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest"

    # Subscriber-style NPC org (org: npc_subscriber). Installs the latest released Flow Tool Kit via install_managed,
    # then the NPC licenses/permission sets, force-app-npc configuration and sample data - mirrors npc_dev_org steps 7-11.3
    # verbatim. update_admin_profile is skipped (fails on PersonAccounts); the Grantmaking Portal community is NOT created.
    npc_conversion_post_install:
        description: Post-install content for the NPC conversion extension - everything the extension cannot ship because the base package owns it. Picklist values (Conversion Rules incl. Account is Household, Account record types Household and Organization, the PersonAccount contact record type as the value set's default, the NPC_Person_Account_Match Contact matching rule), their Conversion Type mapping, and the four Conversion Mapping Default repoints from unpackaged/npc-conversion-post. PersonAccount and NPC_Person_Account_Match are flagged as value-level defaults, which a subscriber may set; they take effect only once the base stops shipping these fields with a formula default (the formula wins on insert and cannot be changed or removed post-install - Cannot modify managed object, field=DefaultValue). Until then the engines resolve -- Use Default -- to the person record type and always name the NPC matching rule themselves. Run after the extension is installed in a subscriber; in the namespaced extension-development org run npc_conversion_config instead.
        steps:
            1:
                task: add_npc_conversion_rules
            2:
                task: add_npc_conversion_rule_dependencies
            3:
                task: add_npc_account_record_types
            4:
                task: add_npc_contact_record_type
            5:
                task: add_npc_contact_matching_rule
            6:
                task: deploy_npc_conversion_post

    npc_conversion_config:
        description: Dev loop for the namespaced extension-development org - deploy the extension source (flows, permission set, matching rules, test class), then the same post-install content a subscriber gets, with the picklist tasks in managed False mode because that org retrieves base fields under bare names.
        steps:
            1:
                task: deploy_npc_conversion
            2:
                flow: npc_conversion_post_install
                options:
                    add_npc_conversion_rules:
                        managed: False
                    add_npc_conversion_rule_dependencies:
                        managed: False
                    add_npc_account_record_types:
                        managed: False
                    add_npc_contact_record_type:
                        managed: False
                    add_npc_contact_matching_rule:
                        managed: False

    npc_conversion_dev_org:
        description: EXTENSION-DEVELOPMENT org build - the full subscriber-style NPC org (npc_subscriber_org), then the extension SOURCE and its post-install content (npc_conversion_config). Run against the namespaced feature org for the dev loop. For the package-based install a customer would get, run npc_conversion_install instead.
        steps:
            1:
                flow: npc_subscriber_org
            2:
                flow: npc_conversion_config

    npc_conversion_install:
        description: FULL PACKAGE-BASED INSTALL of the NPC conversion solution, the way a customer receives it - the latest released Flow Tool Kit base, the pinned NPC extension package version (bump install_npc_conversion after each build), then every post-install update the packages cannot carry. PREREQUISITE the flow cannot perform - activate the Standard Person Account Matching Rule, then its duplicate rule, in Setup; they ship inactive and no API can activate a standard rule (#631) - Conversion Rules picklist values including Account is Household, their Conversion Type mapping, the Household and Organization Account record types, the PersonAccount contact record type default, the NPC_Person_Account_Match matching-rule value, and the four Conversion Mapping Default repoints. Run against a subscriber-style NPC org that already has the NPC licenses, permission sets and force-app-npc configuration (npc_subscriber_org builds one). The current extension version is skip-validation, so it installs only in orgs on the cUnite_PBO Dev Hub until a validated build exists.
        steps:
            1:
                flow: dependencies
            2:
                task: install_managed
            3:
                task: install_npc_conversion
            4:
                flow: npc_conversion_post_install

    npc_subscriber_install_org:
        description: End-to-end install-test org - build the subscriber-style NPC org from scratch (npc_subscriber_org), then run the full package-based install on top (npc_conversion_install). The closest scratch-org approximation of a real customer install.
        steps:
            1:
                flow: npc_subscriber_org
            2:
                flow: npc_conversion_install

    npc_subscriber_org:
        description: NPC org with the latest released Flow Tool Kit INSTALLED (works for a non-namespaced subscriber org and for the namespaced extension-development org - local NPC names carry %%%NAMESPACED_ORG%%% tokens), NPC licenses and permission sets, force-app-npc configuration, stage definitions and sample data. No community.
        steps:
            1:
                flow: dependencies
            2:
                task: install_managed
            3:
                task: deploy_post
                options:
                    path: unpackaged/post
            4:
                task: deploy
                options:
                    path: force-app-post
            5:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User
            6:
                task: assign_permission_set_licenses
                options:
                    api_names: OmniStudioDesigner,ActionPlansPsl,GrantmakingPsl,FundraisingAccessPsl,ProgramManagementPsl,DynamicAssessmentPsl,GroupMembershipPsl,DocumentChecklistPsl,CarePlansPermissionSetLicense,IndustriesAssessmentPsl
                ignore_failure: True
            # NPC Permission Sets
            7:
                task: assign_permission_sets
                options:
                    api_names: OmniStudioAdmin,OmniStudioExecution,ActionPlans,GrantmakingManager,FundraisingAccess,AdvancedProgramManagement,DynamicAssessmentPsl,GroupMembershipPsl,AnalyticsStoreUser,DocumentChecklist,CarePlansPermissionSetLicense,IndustriesAssessmentPermissionSet,IndustriesInteractionSummaryPsl,Fundraising_Admin
                ignore_failure: True
            # NPC Admin Setup
            8:
                task: execute_anon
                options:
                    path: datasets/npc/setup_admin_user.apex
                ignore_failure: True
            # Deploy NPC metadata
            9:
                task: deploy
                options:
                    path: force-app-npc
                ui_options:
                    name: "Deploy NPC Configuration (fields, profiles, LWC, Apex, Flows, FlexiPages, List Views, Settings, Sharing)"
            # NPC Stage Definitions
            10:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_stage_definitions.apex
                ignore_failure: True
            # NPC Sample Data (Snowfakery)
            10.1:
                task: generate_and_load_from_yaml
                options:
                    generator_yaml: datasets/npc/npc_sample_data.recipe.yml
                ignore_failure: True
            # NPC Sample Accounts
            10.2:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_accounts.apex
                ignore_failure: True
            # NPC Sample Data (Apex)
            10.3:
                task: execute_anon
                options:
                    path: datasets/npc/load_npc_sample_data.apex
                ignore_failure: True
            # Create Grantmaking Community

tasks:

    export_form:
        class_path: cci_flowtoolkit_tasks.export_form.ExportFormMetadata

    create_npc_package_version:
        description: Build a 2GP managed version of the NPC conversion extension package (Flow Tool Kit - AFNP | NPC Extension, namespace FlowToolKit, same as the base) from force-app-npc-conversion, depending on the released base version. The package source carries no namespace tokens, so nothing is injected - the namespace is simply the project's. Run against npc_release, whose definition file gives the build org the PersonAccounts and Industries features the metadata needs.
        class_path: cci_flowtoolkit_tasks.extension_package.CreateExtensionPackageVersion
        options:
            package_type: Managed
            package_name: "Flow Tool Kit: AFNP | NPC Extension"
            package_path: force-app-npc-conversion
            dependencies:
                - 04tRQ000000AXCPYA4
            version_base: 1.0.0
            version_type: build
            skip_validation: False
            force_upload: True

    install_npc_conversion:
        description: Install the pinned NPC conversion extension package version into a subscriber-style org. PIN BUMP REQUIRED - after every package build, update the version option to the new SubscriberPackageVersionId. Current pin 1.5.0.1, RELEASED against base 4.33 (built with validation via the native sf CLI - see the force-app-npc-conversion entry in sfdx-project.json; cci's create_package_version cannot send unpackagedMetadata or apexTestAccess, so the validated build goes through sf package version create).
        class_path: cumulusci.tasks.salesforce.InstallPackageVersion
        options:
            name: "Flow Tool Kit: AFNP | NPC Extension"
            namespace: FlowToolKit
            version: 04tRQ000000AcFJYA0

    deploy_npc_matching_rule:
        description: Deploy the NPC_Person_Account_Match matching rule (force-app-npc) as subscriber-owned metadata. Kept out of the extension package on purpose - a packaged rule cannot be edited by the admin who has to tune matching. Deployed in its own step because matching-rule activation is asynchronous and the duplicate rule that references it must deploy after.
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: force-app-npc/main/default/matchingRules

    deploy_npc_duplicate_rule:
        description: Deploy the NPC_Person_Account_Duplicate_Rule duplicate rule (force-app-npc) referencing the NPC_Person_Account_Match matching rule - run deploy_npc_matching_rule first.
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: force-app-npc/main/default/duplicateRules

    add_npc_conversion_rules:
        description: Add the NPC conversion rule values (Account is Household, Create Relationships, and the four Contact1/Contact2 household membership sub-rules Is Primary Group / Included In Group) to the installed package's restricted Conversion Rules picklist. Half of the job - run add_npc_conversion_rule_dependencies next or the values are valid under no Conversion Type. Namespace tokens - run with -o managed False in the namespaced extension-development org.
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        options:
            picklists:
                - "%%%NAMESPACE%%%Form_Template__c.%%%NAMESPACE%%%Conversion_Rules__c"
            entries:
                - fullName: Account is Household
                  label: Account is Household
                - fullName: Create Relationships
                  label: Create Relationships
                - fullName: Contact1 👉 Is Primary Group
                  label: Contact1 👉 Is Primary Group
                - fullName: Contact1 👉 Included In Group
                  label: Contact1 👉 Included In Group
                - fullName: Contact2 👉 Is Primary Group
                  label: Contact2 👉 Is Primary Group
                - fullName: Contact2 👉 Included In Group
                  label: Contact2 👉 Included In Group

    add_npc_conversion_rule_dependencies:
        description: Map the NPC conversion rule values to the Conversion Types they are selectable under (Contact(s), Account, Other), and make the packaged Account rule and the Contact1/Contact2 Add to Account sub-rules selectable on Contact(s) templates too - a Nonprofit Cloud contact form that builds a Household needs the Account rule, and the NPC controller reads Contact1 Add to Account to run people before the Household. Conversion Rules is a dependent picklist, so an unmapped value is hidden in the UI and rejected by DML.
        class_path: tasks.picklist_dependency.AddPicklistDependencies
        options:
            object_api_name: "%%%NAMESPACE%%%Form_Template__c"
            field_api_name: "%%%NAMESPACE%%%Conversion_Rules__c"
            controlling_field_api_name: "%%%NAMESPACE%%%Conversion_Type__c"
            dependencies:
                - value: Account
                  controlling_values:
                      - Contact(s)
                - value: Contact1 👉 Add to Account
                  controlling_values:
                      - Contact(s)
                - value: Contact2 👉 Add to Account
                  controlling_values:
                      - Contact(s)
                - value: Account is Household
                  controlling_values:
                      - Contact(s)
                      - Account
                      - Other
                - value: Create Relationships
                  controlling_values:
                      - Contact(s)
                      - Account
                      - Other
                - value: Contact1 👉 Is Primary Group
                  controlling_values:
                      - Contact(s)
                      - Account
                      - Other
                - value: Contact1 👉 Included In Group
                  controlling_values:
                      - Contact(s)
                      - Account
                      - Other
                - value: Contact2 👉 Is Primary Group
                  controlling_values:
                      - Contact(s)
                      - Account
                      - Other
                - value: Contact2 👉 Included In Group
                  controlling_values:
                      - Contact(s)
                      - Account
                      - Other

    add_npc_account_record_types:
        description: Add Household and Organization to the Form Template's restricted Account (Record Type) picklist. Household turns Household mode on in the NPC controller (the Household engine then also stamps a Household-named Account record type when the org has one); Organization names the org's organisation record type for business conversions. A name with no matching record type degrades to the org default, never fails.
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        options:
            picklists:
                - "%%%NAMESPACE%%%Form_Template__c.%%%NAMESPACE%%%Account_Record_Type__c"
            entries:
                - fullName: Household
                  label: Household
                - fullName: Organization
                  label: Organization

    add_npc_contact_record_type:
        description: Add PersonAccount to the Contact (Record Type) global value set (shared by the Form Template and Page Section fields) and make it the set's default. The Person Account engine resolves it to the org's active person record type on Account.
        class_path: tasks.global_value_set.AddGlobalValueSetEntries
        options:
            api_names:
                - "%%%NAMESPACE%%%Contact_Record_Type"
            entries:
                - fullName: PersonAccount
                  label: PersonAccount
                  default: True

    add_npc_contact_matching_rule:
        description: Add the Standard Person Account Matching Rule to the Contact Matching Rules picklists on the Form Template and the Page Section, flagged as the value-level default, so admins can see and choose the rule the Person Account engine matches with. The rule ships in every Person Accounts org but INACTIVE - activation (Setup, matching rule first, then its duplicate rule) is an install prerequisite; no API can activate a standard rule (#631).
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        options:
            picklists:
                - "%%%NAMESPACE%%%Form_Template__c.%%%NAMESPACE%%%Contact_Matching_Rules__c"
                - "%%%NAMESPACE%%%Form_Template_Page_Section__c.%%%NAMESPACE%%%Contact_Matching_Rules__c"
            entries:
                - fullName: Standard_PersonAccount_Match_Rule_v1_0
                  label: Standard_PersonAccount_Match_Rule_v1_0
                  default: True

    deploy_npc_conversion_post:
        description: Repoint the four packaged Form Template Conversion Mapping Default records (Controller, Account, Primary_Contact, Alternate_Contact) at the NPC flows by deploying subscriber edits of the records themselves - Flow_API_Name__c is SubscriberControlled, and the record filenames carry the ___NAMESPACE___ token so the deploy targets FlowToolKit__Account and friends, never bare-named local twins. A bare-named twin is fatal, not cosmetic - CMT getAll()/getInstance() throw System.ListException (Row with duplicate DeveloperName) when a packaged and local record share a DeveloperName, which kills every conversion (proven in npc_subscriber, 2026-08-31).
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/npc-conversion-post

    deploy_npc_conversion:
        description: Deploy the NPC conversion extension source (force-app-npc-conversion) - flows and permission set only; CMT records and picklist values are separate post-install steps
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: force-app-npc-conversion

    check_lws_enabled:
        class_path: tasks.check_lws_enabled.CheckLWSEnabled
        description: Check if Lightning Web Security (LWS) is enabled

    check_enhanced_email:
        class_path: tasks.check_enhanced_email.CheckEnhancedEmailEnabled
        description: Check if Enhanced Email is enabled

    check_npc_conversion_installed:
        class_path: tasks.check_package_installed.CheckPackageInstalled
        description: Preflight check - is the NPC conversion extension already installed? Gates the one-time post-install content on the npc plan. The extension shares the FlowToolKit namespace with the base, so get_installed_packages cannot tell them apart and this queries InstalledSubscriberPackage by package name instead.
        options:
            package_name: "Flow Tool Kit: AFNP | NPC Extension"

    create_package_version:
        options:
            post_install_script: InstallScript

    github_copy_subtree:
        options:
            repo_url: "https://github.com/common-unite/Flow_Tool_Kit_Public"
            branch: "main"
            create_release: true
            release_body: true
            # Everything the MetaDeploy install plans reference must ship to the public repo:
            # tasks/ holds the preflight check classes and the two vendored metadata-ETL tasks,
            # force-app-post and unpackaged/npc-conversion-post are deployed by plan steps.
            # Deploying a path the mirror never received fails at INSTALL time, not at publish time.
            include: [ "cumulusci.yml","sfdx-project.json","orgs/","README.md","documents/",
                       "tasks/","force-app-post/","force-app-npc-conversion/",
                       "unpackaged/npc-conversion-post/" ]

    # Installer-only publish, decoupled from a base package release. Pushes the current master
    # content to Flow_Tool_Kit_Public@main as a plain commit: no tag, no release, repeatable.
    # Run after any change to plans, tasks/ or the unpackaged directories the plans reference.
    # Then, in a clone of the public repo, tag the installer revision (release/4.33.0.2, .3, ...)
    # and run metadeploy_publish against it. Tag ONLY, never a GitHub release: get_latest_tag
    # reads Releases, so a release on an installer tag would make install_managed resolve a
    # package version that was never built.
    publish_installers:
        description: Push the MetaDeploy installer payload from current master to the Flow_Tool_Kit_Public 'installer' branch without cutting a release. Deliberately EXCLUDES documents/ (235 MB of screenshots that main keeps as the public image host) because MetaDeploy reads the whole tagged tree into memory on every preflight; tag release/<base>.<n> from this branch.
        class_path: cumulusci.tasks.github.publish.PublishSubtree
        options:
            repo_url: "https://github.com/common-unite/Flow_Tool_Kit_Public"
            branch: "installer"
            ref: heads/master
            create_release: False
            include: [ "cumulusci.yml","sfdx-project.json","orgs/","README.md",
                       "tasks/","force-app-post/","force-app-npc-conversion/",
                       "unpackaged/npc-conversion-post/" ]

    robot:
        options:
            suites: robot/FormBuilder/tests
            options:
                outputdir: robot/FormBuilder/results

    robot_testdoc:
        options:
            path: robot/FormBuilder/tests
            output: robot/FormBuilder/doc/FormBuilder_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 90


orgs:
    scratch:
        build:
            config_file: orgs/build.json

        packaging:
            config_file: orgs/packaging.json

        dev:
            config_file: orgs/dev.json
            days: 30
            namespaced: True

        # Subscriber-sim org for #405 screen-flow perf baselines: released package INSTALLED, not source.
        # Deliberately non-namespaced - extension packages (Stripe, UnofficialSF) require the installed base.
        perf_baseline:
            config_file: orgs/dev.json
            days: 30
            namespaced: False


        # #513 Form Design Kit: renders the showcase form so Phase 2 can capture
        # real markup and screenshots from the running renderer.
        feature_form-design-kit:
            config_file: orgs/dev.json
            days: 30
            namespaced: True





        # #74 NPC PersonAccount conversion: EXTENSION-DEVELOPMENT org. Namespaced (FlowToolKit) with the released
        # base package INSTALLED (never source-deployed), so the NPC conversion flows are built and packaged as a
        # same-namespace 2GP extension. Local NPC metadata is namespace-agnostic through %%%NAMESPACED_ORG%%% tokens.
        npc_release:
            config_file: orgs/npc.json
            days: 1
            namespaced: True
        feature_npc-person-account-conversion:
            config_file: orgs/npc.json
            days: 30
            namespaced: True

        # Subscriber-style NPC org: latest RELEASED Flow Tool Kit installed (never source), non-namespaced,
        # so force-app-npc is built and deployed exactly as a client would. Community is deliberately not created here.
        npc_subscriber:
            config_file: orgs/npc.json
            days: 30
            namespaced: False

        npc:
            config_file: orgs/npc.json
            days: 30
            namespaced: True

